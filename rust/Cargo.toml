[workspace]
resolver = "2"
members = [
    "rustygrade-core",
    "rustygrade-usb",
    "rustygrade-ffi",
    "uniffi-bindgen",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
rayon = "1.10"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "6.2", features = ["image"] }
urlencoding = "2.1"
indexmap = { version = "2", features = ["serde"] }
uniffi = "0.32"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release.package.rustygrade-usb]
opt-level = 3
