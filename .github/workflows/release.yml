name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versionName:
        description: "Release versionName (e.g. 1.0.0). workflow_dispatch builds artifacts only; it never publishes a GitHub Release."
        required: false
        default: "1.0.0"

# Least privilege: the default token is read-only. Only the `publish` job below widens it to
# `contents: write`, and it never runs the build, Gradle, or any signing material.
permissions:
  contents: read

# Never cancel a release mid-flight: a half-uploaded GitHub Release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: "27.3.13750724"
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

# Every third-party action is pinned to a full commit SHA (tag in the trailing comment).
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Rust clippy and tests
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build Rust (.so) and generate UniFFI Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./scripts/build-rust.sh

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Resolve release metadata and signing keystore
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.versionName }}
          REF_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${INPUT_VERSION_NAME:-1.0.0}"
          else
            VERSION_NAME="${REF_NAME#v}"
          fi
          VERSION_NAME="${VERSION_NAME:-1.0.0}"
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid versionName '${VERSION_NAME}'" >&2
            exit 1
          fi

          # A hyphen suffix (1.2.0-rc.1) is a SemVer pre-release: never publish it as "Latest".
          PRERELEASE=false
          if [[ "${VERSION_NAME}" == *-* ]]; then
            PRERELEASE=true
          fi

          # Signing is all-or-nothing: a partially configured set of secrets is almost certainly
          # a typo, and silently falling back to an unsigned build would hide it.
          SET_COUNT=0
          for secret in "${KEYSTORE_B64}" "${KEYSTORE_PASS}" "${KEYSTORE_ALIAS}" "${KEY_PASS}"; do
            if [[ -n "${secret}" ]]; then
              SET_COUNT=$((SET_COUNT + 1))
            fi
          done
          if [[ "${SET_COUNT}" -gt 0 && "${SET_COUNT}" -lt 4 ]]; then
            echo "error: only ${SET_COUNT}/4 signing secrets are set; ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD must all be set or all be empty" >&2
            exit 1
          fi
          if [[ "${FULL_REF}" == refs/tags/v* && "${SET_COUNT}" -ne 4 ]]; then
            echo "error: tagged releases require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets" >&2
            exit 1
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          if [[ "${SET_COUNT}" -eq 4 ]]; then
            KS_FILE="${RUNNER_TEMP}/release-keystore.p12"
            # Pasted base64 often carries spaces / CR / LF; strip them before decoding.
            printf '%s' "${KEYSTORE_B64}" | tr -d ' \t\r\n' | base64 --decode > "${KS_FILE}"
            if [[ ! -s "${KS_FILE}" ]]; then
              echo "error: ANDROID_KEYSTORE_BASE64 decoded to an empty file" >&2
              exit 1
            fi
            # Fail early (and loudly) on a wrong password or alias rather than inside Gradle.
            if ! KT_OUT="$(keytool -list -keystore "${KS_FILE}" -storepass:env KEYSTORE_PASS \
              -alias "${KEYSTORE_ALIAS}" 2>&1)"; then
              echo "error: cannot open keystore / alias with the provided secrets: ${KT_OUT}" >&2
              exit 1
            fi
            echo "keystore_path=${KS_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs (split + universal) and AAB
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RUSTYGRADE_KEYSTORE_PATH: ${{ steps.meta.outputs.keystore_path }}
          RUSTYGRADE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUSTYGRADE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUSTYGRADE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -PsplitApks=true \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}"
          ./gradlew bundleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}"

      - name: Stage release artifacts, verify signatures, and generate checksums
        env:
          FULL_REF: ${{ github.ref }}
          KEYSTORE_PATH: ${{ steps.meta.outputs.keystore_path }}
        run: |
          set -euo pipefail
          mkdir -p release-dist release-mapping
          cp android/app/build/outputs/apk/release/*.apk release-dist/
          cp android/app/build/outputs/bundle/release/*.aab release-dist/
          # R8 mapping: needed to de-obfuscate crash traces for exactly this build. It is archived as a
          # private workflow artifact and deliberately NOT attached to the public GitHub Release.
          cp android/app/build/outputs/mapping/release/mapping.txt release-mapping/mapping.txt

          for abi in arm64-v8a x86_64 universal; do
            compgen -G "release-dist/*-${abi}-*.apk" >/dev/null || {
              echo "error: missing ${abi} release APK" >&2
              exit 1
            }
          done

          if [[ "${FULL_REF}" == refs/tags/v* || -n "${KEYSTORE_PATH}" ]]; then
            if compgen -G "release-dist/*-unsigned.apk" >/dev/null; then
              echo "error: unsigned APK produced when signing was required" >&2
              exit 1
            fi
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)/apksigner"
            for apk in release-dist/*.apk; do
              "${APKSIGNER}" verify "${apk}"
            done
            # `jarsigner -strict` exits 4 for a self-signed certificate (the normal case for a
            # release keystore) and plain `jarsigner -verify` exits 0 even for an unsigned file,
            # so assert on the "jar verified" line instead of the exit status.
            for aab in release-dist/*.aab; do
              out="$(jarsigner -verify "${aab}" 2>&1 || true)"
              if ! grep -q '^jar verified' <<<"${out}"; then
                echo "error: AAB signature verification failed for ${aab}" >&2
                echo "${out}" >&2
                exit 1
              fi
              echo "jarsigner verified: ${aab}"
            done
          fi

          (cd release-dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh release-dist release-mapping

      - name: Cleanup keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.p12"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustygrade-release-bundle
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustygrade-r8-mapping-${{ steps.meta.outputs.version_name }}
          path: release-mapping/mapping.txt
          if-no-files-found: error
          retention-days: 90

  # Only a tag push publishes. A manual workflow_dispatch (even one started on a v* tag ref) builds
  # and uploads artifacts but can never create or clobber a GitHub Release with a mismatched versionName.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rustygrade-release-bundle
          path: release-dist

      - name: Re-verify checksums
        run: cd release-dist && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-dist/*.apk release-dist/*.aab release-dist/SHA256SUMS.txt --clobber
          else
            if [[ "${PRERELEASE}" == "true" ]]; then
              RELEASE_FLAGS=(--prerelease)
            else
              RELEASE_FLAGS=(--latest)
            fi
            gh release create "${TAG_NAME}" release-dist/*.apk release-dist/*.aab release-dist/SHA256SUMS.txt \
              --title "Rustygrade ${TAG_NAME#v}" --generate-notes "${RELEASE_FLAGS[@]}"
          fi
