name: Android

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded PR/branch runs; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NDK_VERSION: "27.3.13750724"
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

# Every third-party action is pinned to a full commit SHA (tag in the trailing comment).
jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        working-directory: rust
        run: cargo test --workspace

  build-apk:
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build Rust (.so) and generate UniFFI Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./scripts/build-rust.sh

      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: assembleRelease (R8 + ABI splits verification)
        working-directory: android
        run: ./gradlew assembleRelease -PsplitApks=true

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustygrade-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustygrade-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
